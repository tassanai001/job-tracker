version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: jobtracker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: jobtracker-app
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    env_file:
      - .env
    restart: unless-stopped

volumes:
  mongo_data: